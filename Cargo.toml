[package]
name = "hub-hal"
version = "0.9.0"
edition = "2021"
description = "Hardware support for the Lenovo ThinkSmart Hub 500 on Debian"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MJPEG, which is the only format the webcam on this fleet offers. Pure Rust, so
# it cross-builds and cannot drag a C toolchain into an image.
zune-jpeg = "0.4"
