[package]
name = "hub-hal"
version = "0.11.0"
edition = "2021"
description = "Hardware support for the Lenovo ThinkSmart Hub 500 on Debian"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MJPEG, which is the only format the webcam on this fleet offers. Pure Rust, so
# it cross-builds and cannot drag a C toolchain into an image.
zune-jpeg = "0.4"
# Pairing needs an AGENT, which is a served D-Bus object rather than a call, and
# busctl is a client only. Pure Rust: it speaks the protocol over the socket
# itself, so it adds no C library and no development package to a crate that is
# built on one machine and shipped to others with no compiler.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
